# Run the F404 application test suite.
#
# Separate from pycycle_test_workflow.yml, which runs the vendored upstream
# library's own suite under testflo. This one covers src/f404/ only.
name: F404 Tests

# PRs get the fast tests only (~1 min). The full suite (~14 min, dominated by
# the tests marked `slow`) runs on push to main, on manual dispatch, and on a PR
# carrying the `full-ci` label: apply it when the PR is about to merge.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, labeled ]
  workflow_dispatch:

# A new push supersedes the PR's in-flight run. The label name is in the key so
# that labelling a PR (which fires this workflow) cancels nothing.
concurrency:
  group: f404-${{ github.ref }}-${{ github.event.label.name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  fast:

    # `labeled` runs exist to trigger `full`; a fast run for them is redundant.
    if: github.event_name == 'pull_request' && github.event.action != 'labeled'

    timeout-minutes: 10

    runs-on: ubuntu-latest

    name: F404 fast (ubuntu py3.12)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[all]

      - name: Run fast tests
        run: |
          pytest tests -m "not slow" -v

  full:

    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')

    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest supported interpreters. The suite asserts on
        # converged solver output, so it is worth knowing early if a NumPy or
        # SciPy version moves the numbers.
        include:
          - OS: ubuntu-latest
            PY: '3.9'
          - OS: ubuntu-latest
            PY: '3.12'
          - OS: macos-latest
            PY: '3.12'

    runs-on: ${{ matrix.OS }}

    name: F404 full ${{ matrix.OS }} py${{ matrix.PY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.PY }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[all]

      - name: Run tests
        run: |
          pytest tests --cov=f404 --cov-report=term-missing -v
